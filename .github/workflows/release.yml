name: Build and publish release bundle

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag, for example v0.1.0rc1'
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify tag and compile application
        shell: bash
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG}"
          version="${tag#v}"
          expected="$(python -c "import sys; sys.path.insert(0, 'nonebot'); import app_version; print(app_version.PACKAGE_VERSION)")"
          test "$version" = "$expected" || {
            echo "tag $tag does not match app_version.PACKAGE_VERSION $expected" >&2
            exit 1
          }
          python -m compileall -q nonebot

  package:
    needs: verify
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0
      - name: Verify tag matches application version
        shell: bash
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG}"
          version="${tag#v}"
          expected="$(python -c "import sys; sys.path.insert(0, 'nonebot'); import app_version; print(app_version.PACKAGE_VERSION)")"
          test "$version" = "$expected" || {
            echo "tag $tag does not match app_version.PACKAGE_VERSION $expected" >&2
            exit 1
          }
      - name: Build tracked source archives
        shell: bash
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG}"
          prefix="denia-bot-${tag#v}"
          mkdir -p dist
          git archive --format=tar.gz --prefix="${prefix}/" -o "dist/${prefix}.tar.gz" HEAD
          git archive --format=zip --prefix="${prefix}/" -o "dist/${prefix}.zip" HEAD
          (cd dist && sha256sum "${prefix}.tar.gz" "${prefix}.zip" > SHA256SUMS)
          ls -lh dist
      - uses: actions/upload-artifact@v4
        with:
          name: denia-bot-${{ env.RELEASE_TAG }}
          path: dist/*

  publish:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/download-artifact@v4
        with:
          pattern: denia-bot-${{ env.RELEASE_TAG }}
          path: dist
          merge-multiple: true
      - name: Upload assets to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG}"
          display_version="$(python -c "import sys; sys.path.insert(0, 'nonebot'); import app_version; print(app_version.VERSION)")"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
          else
            case "$tag" in
              *b*|*beta*|*BETA*|*rc*|*RC*) prerelease="--prerelease" ;;
              *) prerelease="" ;;
            esac
            gh release create "$tag" dist/* \
              --title "$display_version" \
              --notes-file CHANGELOG.md \
              $prerelease
          fi
